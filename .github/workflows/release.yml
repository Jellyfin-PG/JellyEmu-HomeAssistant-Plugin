name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (leave blank to use version from manifest.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: Releases can only be built from commits on the main branch."
            exit 1
          fi

      - name: Determine Release Tag
        id: resolve-tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -f "custom_components/jellyemu/manifest.json" ]; then
            VERSION=$(jq -r .version custom_components/jellyemu/manifest.json)
            TAG="v${VERSION}"
          else
            TAG="v1.0.0"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Using release tag: ${TAG}"

      - name: Package Integration Zip
        run: |
          # Package custom_components/jellyemu into jellyemu.zip
          cd custom_components
          zip -r ../jellyemu.zip jellyemu
          cd ..

      - name: Locate Card File
        id: find-card
        run: |
          if [ -f "cards/jellyemu-card.js" ]; then
            echo "CARD_PATH=cards/jellyemu-card.js" >> $GITHUB_ENV
          elif [ -f "custom_components/jellyemu/www/jellyemu-card.js" ]; then
            echo "CARD_PATH=custom_components/jellyemu/www/jellyemu-card.js" >> $GITHUB_ENV
          elif [ -f "www/jellyemu-card.js" ]; then
            echo "CARD_PATH=www/jellyemu-card.js" >> $GITHUB_ENV
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            jellyemu.zip
            ${{ env.CARD_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
